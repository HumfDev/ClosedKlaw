<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Upload your resume, KleoKlaw</title>
  <meta name="description" content="Upload your resume so KleoKlaw can match and apply to jobs for you." />
  <link rel="stylesheet" href="/styles.css" />
<script src="/page-enter.js"></script>
</head>

<body class="onboarding-page">
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">KleoKlaw</a>
    </div>
  </header>

  <div class="page-content">
    <main class="onboarding-card">
      <h1>Upload your resume</h1>
      <p class="onboarding-lede" id="intro">Send a PDF (or Word doc). We'll text you a summary to confirm.</p>
      <form id="upload-form">
        <label class="file-field">
          <input id="file-input" type="file"
            accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            required />
        </label>
        <button id="upload-btn" class="btn-submit" type="submit">Upload resume</button>
      </form>
      <div id="status" class="status" role="status"></div>
      <p id="done-msg" class="hidden status ok">Got it! Check your texts to confirm your resume.</p>
    </main>
  </div>

  <script src="/onboarding/web-config.js"></script>
  <script src="/transitions.js" type="module"></script>
  <script src="/apple-motion.js" type="module"></script>
  <script>
    const API_BASE = window.KLEOKLAW_API_BASE || "";
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session");
    const statusEl = document.getElementById("status");
    const doneMsg = document.getElementById("done-msg");
    const form = document.getElementById("upload-form");
    const btn = document.getElementById("upload-btn");
    const fileInput = document.getElementById("file-input");

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (isError ? " error" : "");
    }

    if (!sessionId) {
      setStatus("Missing session link. Open the URL from your SMS.", true);
      form.classList.add("hidden");
      throw new Error("no session");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = fileInput.files && fileInput.files[0];
      if (!file) {
        setStatus("Pick a PDF or Word file first.", true);
        return;
      }
      btn.disabled = true;
      setStatus("Uploading…");
      try {
        const body = new FormData();
        body.append("session_id", sessionId);
        body.append("file", file, file.name);
        const res = await fetch(`${API_BASE}/onboarding/resume/upload`, {
          method: "POST",
          body,
        });
        const payload = await res.json().catch(() => ({}));
        if (!res.ok) {
          const detail = payload.detail;
          const msg = typeof detail === "string"
            ? detail
            : detail?.message || res.statusText;
          throw new Error(msg);
        }
        setStatus("");
        doneMsg.classList.remove("hidden");
        document.getElementById("intro").classList.add("hidden");
        form.classList.add("hidden");
      } catch (err) {
        setStatus(String(err.message || err), true);
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
