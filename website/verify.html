<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Verify your email, KleoKlaw</title>
  <meta name="description" content="Verify your email so KleoKlaw can apply to jobs on your behalf." />
  <link rel="stylesheet" href="/styles.css" />
<script src="/page-enter.js"></script>
</head>

<body class="onboarding-page">
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">KleoKlaw</a>
    </div>
  </header>

  <div class="page-content">
    <main class="onboarding-card">
      <h1>Verify your email</h1>
      <p class="onboarding-lede" id="intro">
        Sign in with Google so KleoKlaw can use your verified email for job applications. We'll text you the next step
        automatically.
      </p>
      <button id="google-btn" class="btn-google" type="button" disabled>
        <svg class="google-icon" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335"
            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
          <path fill="#4285F4"
            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
          <path fill="#FBBC05"
            d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
          <path fill="#34A853"
            d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
        </svg>
        Continue with Google
      </button>
      <div id="status" class="status" role="status"></div>
      <p id="done-msg" class="hidden status ok">Verified! Check your texts for the next step.</p>
    </main>
  </div>

  <script src="/onboarding/web-config.js"></script>
  <script src="/transitions.js" type="module"></script>
  <script src="/apple-motion.js" type="module"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    const API_BASE = window.KLEOKLAW_API_BASE || "";

    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session");
    const statusEl = document.getElementById("status");
    const doneMsg = document.getElementById("done-msg");
    const btn = document.getElementById("google-btn");

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (isError ? " error" : "");
    }

    if (!sessionId) {
      setStatus("Missing session link. Open the URL from your SMS.", true);
      throw new Error("no session");
    }

    let firebaseAuth;
    try {
      const res = await fetch(`${API_BASE}/onboarding/verify/config`);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || res.statusText);
      }
      const config = await res.json();
      const app = initializeApp(config);
      firebaseAuth = getAuth(app);
      btn.disabled = false;
    } catch (err) {
      setStatus(String(err.message || err), true);
    }

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      setStatus("Opening Google sign-in…");
      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });
        const cred = await signInWithPopup(firebaseAuth, provider);
        const idToken = await cred.user.getIdToken();
        const confirmRes = await fetch(`${API_BASE}/onboarding/verify/confirm`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, id_token: idToken }),
        });
        const body = await confirmRes.json().catch(() => ({}));
        if (!confirmRes.ok) {
          throw new Error(body.detail || confirmRes.statusText);
        }
        setStatus("");
        doneMsg.classList.remove("hidden");
        document.getElementById("intro").classList.add("hidden");
        btn.classList.add("hidden");
      } catch (err) {
        setStatus(String(err.message || err), true);
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
